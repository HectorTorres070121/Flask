<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if editing_mac %}Modificar router{% else %}Agregar router{% endif %}</title>
    <style>
        body {
            background: #f9fafb;
            color: #1f2937;
            font-family: Arial, sans-serif;
            margin: 2rem auto;
            max-width: 900px;
            padding: 0 1rem;
        }

        .page-header {
            align-items: center;
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            align-items: center;
            color: #2563eb;
            display: inline-flex;
            height: 2rem;
            justify-content: center;
            width: 2rem;
        }

        .back-link svg {
            fill: none;
            height: 100%;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2;
            width: 100%;
        }

        form {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1.5rem;
        }

        .fields,
        .vlan-fields {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        label {
            display: flex;
            flex-direction: column;
            font-weight: 600;
            gap: 0.4rem;
        }

        input,
        textarea,
        select {
            border: 1px solid #d1d5db;
            border-radius: 0.3rem;
            box-sizing: border-box;
            font: inherit;
            font-weight: 400;
            padding: 0.65rem;
            width: 100%;
        }

        textarea {
            min-height: 5rem;
            resize: vertical;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .help {
            color: #6b7280;
            font-size: 0.85rem;
            font-weight: 400;
        }

        .vlan-list {
            display: grid;
            gap: 1rem;
            margin: 1rem 0;
        }

        .vlan-card {
            border: 1px solid #d1d5db;
            border-radius: 0.4rem;
            min-width: 0;
            padding: 1rem;
        }

        .vlan-heading {
            align-items: center;
            display: flex;
            justify-content: space-between;
        }

        .vlan-heading h3 {
            margin: 0 0 1rem;
        }

        .button-row {
            display: flex;
            gap: 0.75rem;
            justify-content: space-between;
            margin-top: 1.5rem;
        }

        button {
            background: #2563eb;
            border: 0;
            border-radius: 0.3rem;
            color: #fff;
            cursor: pointer;
            font: inherit;
            padding: 0.7rem 1rem;
        }

        button.secondary {
            background: #4b5563;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .errors {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            border-radius: 0.3rem;
            color: #991b1b;
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
        }

        @media (max-width: 640px) {
            .fields,
            .vlan-fields {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>
    <main>
        <header class="page-header">
            <a class="back-link" href="{{ url_for('routers') }}" aria-label="Regresar a la tabla" title="Regresar">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 12H5m7 7-7-7 7-7"></path>
                </svg>
            </a>
            <h1>{% if editing_mac %}Modificar router{% else %}Agregar router{% endif %}</h1>
        </header>

        <form method="post" action="{{ form_action }}">
            {% if errors %}
            <div class="errors" role="alert">
                <ul>
                    {% for error in errors %}
                    <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}

            <div class="fields">
                <label>
                    MAC
                    <input name="mac" value="{{ values.mac }}" pattern="[A-Za-z0-9]{2}(:[A-Za-z0-9]{2}){5}" maxlength="17" title="Usa seis grupos de dos letras o números separados por dos puntos (ejemplo: 3D:RF:09:7F:00:00)." required>
                </label>
                <label>
                    Nombre
                    <input name="name" value="{{ values.name }}" pattern="[A-Za-zÀ-ÖØ-öø-ÿ0-9][A-Za-zÀ-ÖØ-öø-ÿ0-9 _.-]{0,49}" maxlength="50" title="Usa hasta 50 letras, números, espacios, puntos, guiones o guiones bajos." required>
                </label>
                <label class="full-width">
                    Protocolos
                    <textarea name="protocolos" data-list-pattern="^[A-Za-z][A-Za-z0-9_-]{0,31}$" data-list-error="Cada protocolo debe iniciar con una letra y contener solo letras, números, guion o guion bajo (máximo 32 caracteres)." placeholder="Un protocolo por línea o separados por comas">{{ values.protocolos }}</textarea>
                    <span class="help">Ejemplo: OSPF, STP</span>
                </label>
                <label>
                    Estado
                    <select name="estatus" required>
                        <option value="online" {% if values.estatus == "online" %}selected{% endif %}>online</option>
                        <option value="offline" {% if values.estatus == "offline" %}selected{% endif %}>offline</option>
                    </select>
                </label>
            </div>

            <section>
                <h2>VLANs</h2>
                <div class="vlan-list" id="vlan-list">
                    {% for vlan in values.vlans %}
                    <fieldset class="vlan-card">
                        <div class="vlan-heading">
                            <h3>VLAN</h3>
                            <button type="button" class="secondary remove-vlan">Quitar VLAN</button>
                        </div>
                        <div class="vlan-fields">
                            <label>
                                Nombre de VLAN
                                <input name="vlan_name" value="{{ vlan.name }}" pattern="[A-Za-z][A-Za-z0-9_-]{0,31}" maxlength="32" title="Inicia con una letra; usa solo letras, números, guiones o guion bajo (máximo 32 caracteres)." required>
                            </label>
                            <label>
                                IP
                                <input name="vlan_ip" value="{{ vlan.ip }}" pattern="(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])" maxlength="15" title="Ingresa una dirección IPv4 válida (ejemplo: 192.168.1.1).">
                            </label>
                            <label>
                                Puertos
                                <textarea name="vlan_ports" data-list-pattern="^[A-Za-z][A-Za-z0-9/-]{0,31}$" data-list-error="Cada puerto debe iniciar con una letra y contener solo letras, números, / o guion (máximo 32 caracteres)." placeholder="Un puerto por línea o separados por comas">{{ vlan.ports }}</textarea>
                            </label>
                            <label>
                                Políticas
                                <textarea name="vlan_policies" data-list-pattern="^[A-Za-z][A-Za-z0-9_-]{0,31}$" data-list-error="Cada política debe iniciar con una letra y contener solo letras, números, guion o guion bajo (máximo 32 caracteres)." placeholder="Una política por línea o separadas por comas">{{ vlan.policies }}</textarea>
                            </label>
                            <label>
                                ET
                                <select name="vlan_et" required>
                                    <option value="true" {% if vlan.et == "true" %}selected{% endif %}>true</option>
                                    <option value="false" {% if vlan.et == "false" %}selected{% endif %}>false</option>
                                </select>
                            </label>
                            <label>
                                SSH
                                <select name="vlan_ssh" required>
                                    <option value="true" {% if vlan.ssh == "true" %}selected{% endif %}>true</option>
                                    <option value="false" {% if vlan.ssh == "false" %}selected{% endif %}>false</option>
                                </select>
                            </label>
                        </div>
                    </fieldset>
                    {% endfor %}
                </div>
                <button type="button" class="secondary" id="add-vlan">Agregar VLAN</button>
            </section>

            <div class="button-row">
                <a href="{{ url_for('routers') }}">Cancelar</a>
                <button type="submit">Enviar</button>
            </div>
        </form>
    </main>

    <template id="vlan-template">
        <fieldset class="vlan-card">
            <div class="vlan-heading">
                <h3>VLAN</h3>
                <button type="button" class="secondary remove-vlan">Quitar VLAN</button>
            </div>
            <div class="vlan-fields">
                <label>
                    Nombre de VLAN
                    <input name="vlan_name" value="" pattern="[A-Za-z][A-Za-z0-9_-]{0,31}" maxlength="32" title="Inicia con una letra; usa solo letras, números, guiones o guion bajo (máximo 32 caracteres)." required>
                </label>
                <label>
                    IP
                    <input name="vlan_ip" value="" pattern="(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])" maxlength="15" title="Ingresa una dirección IPv4 válida (ejemplo: 192.168.1.1).">
                </label>
                <label>
                    Puertos
                    <textarea name="vlan_ports" data-list-pattern="^[A-Za-z][A-Za-z0-9/-]{0,31}$" data-list-error="Cada puerto debe iniciar con una letra y contener solo letras, números, / o guion (máximo 32 caracteres)." placeholder="Un puerto por línea o separados por comas"></textarea>
                </label>
                <label>
                    Políticas
                    <textarea name="vlan_policies" data-list-pattern="^[A-Za-z][A-Za-z0-9_-]{0,31}$" data-list-error="Cada política debe iniciar con una letra y contener solo letras, números, guion o guion bajo (máximo 32 caracteres)." placeholder="Una política por línea o separadas por comas"></textarea>
                </label>
                <label>
                    ET
                    <select name="vlan_et" required>
                        <option value="true" selected>true</option>
                        <option value="false">false</option>
                    </select>
                </label>
                <label>
                    SSH
                    <select name="vlan_ssh" required>
                        <option value="true" selected>true</option>
                        <option value="false">false</option>
                    </select>
                </label>
            </div>
        </fieldset>
    </template>

    <script>
        const vlanList = document.getElementById("vlan-list");
        const vlanTemplate = document.getElementById("vlan-template");
        const form = document.querySelector("form");

        function validateListField(field) {
            const itemPattern = new RegExp(field.dataset.listPattern);
            const invalidItem = field.value
                .split(/[,\n]/)
                .map((item) => item.trim())
                .find((item) => item && !itemPattern.test(item));
            field.setCustomValidity(invalidItem ? field.dataset.listError : "");
        }

        form.addEventListener("input", (event) => {
            if (event.target.matches("[data-list-pattern]")) {
                validateListField(event.target);
            }
        });

        form.addEventListener("submit", () => {
            form.querySelectorAll("[data-list-pattern]").forEach(validateListField);
        });

        function updateRemoveButtons() {
            const vlanCards = vlanList.querySelectorAll(".vlan-card");
            vlanCards.forEach((card) => {
                card.querySelector(".remove-vlan").disabled = vlanCards.length === 1;
            });
        }

        document.getElementById("add-vlan").addEventListener("click", () => {
            vlanList.appendChild(vlanTemplate.content.cloneNode(true));
            updateRemoveButtons();
        });

        vlanList.addEventListener("click", (event) => {
            if (event.target.closest(".remove-vlan")) {
                event.target.closest(".vlan-card").remove();
                updateRemoveButtons();
            }
        });

        updateRemoveButtons();
    </script>
</body>
</html>
